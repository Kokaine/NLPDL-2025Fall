### model
model_name_or_path: Qwen/Qwen1.5-0.5B

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all

### dataset
dataset: samsum
template: qwen
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: qwen-0.5b/lora/sft
logging_steps: 10
save_steps: 100
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true

### eval
val_size: 0.1
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 100

### wandb
report_to: swanlab
run_name: qwen_samsum_lora_run